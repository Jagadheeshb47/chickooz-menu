
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chickooz Fried Chicken – Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@500;700;800&family=Noto+Sans+Tamil:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b110b;--card:#2a1a10;--ink:#fff3e0;--muted:#d9b998;--gold:#f5a623;--red:#d62d20;--line:#4a2f1d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.4}
header{padding:1.4rem 1.2rem 1.2rem;text-align:center;background:linear-gradient(var(--red),#a81f15)}
.badge{margin:0 auto .4rem;text-align:center}
.mark{position:relative;margin:0;font-family:'Bowlby One',Impact,sans-serif;font-weight:400;font-size:clamp(2.3rem,12vw,3.2rem);line-height:1;letter-spacing:.02em;color:#ffe9b0;-webkit-text-stroke:2px #3a1608;paint-order:stroke fill;text-shadow:0 4px 0 #c43a1a}
.ribbon{display:inline-block;margin-top:.6rem;padding:.25rem 1.4rem;background:var(--red);color:#fff;font-weight:800;letter-spacing:.12em;font-size:.95rem;border:2px solid #3a1608;border-radius:4px}
header p{margin:.3rem 0 0;font-weight:800}
.emblem{display:block;width:min(190px,52vw);height:auto;margin:0 auto;filter:drop-shadow(0 6px 0 rgba(58,22,8,.55))}
.tag{margin:.3rem auto 1rem;max-width:92vw;font-family:'Noto Sans Tamil',Nunito,sans-serif;font-weight:900;font-size:clamp(1.25rem,6.2vw,1.9rem);line-height:1.25;color:#ffd23f;-webkit-text-stroke:1.5px #3a1608;paint-order:stroke fill;text-shadow:0 3px 0 #7a1810,0 0 18px rgba(255,190,40,.55);transform:rotate(-2deg)}
.eye{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.eye{animation:none}}
footer .emblem{width:84px;margin-bottom:.6rem;filter:none}
nav{position:sticky;top:0;z-index:5;display:flex;gap:.5rem;overflow-x:auto;padding:.6rem .8rem;background:var(--bg);border-bottom:1px solid var(--line)}
nav a{flex:none;padding:.4rem .9rem;border-radius:99px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:.9rem}
nav a:focus-visible,nav a:hover{background:var(--gold);color:#2a1300;outline:none}
main{max-width:720px;margin:0 auto;padding:1rem}
section{margin:1.6rem 0;scroll-margin-top:3.5rem}
h2{margin:0 0 .6rem;font-family:'Bowlby One',Impact,sans-serif;font-weight:400;font-size:1.5rem;color:var(--gold)}
.note{margin:-.3rem 0 .6rem;color:var(--muted);font-size:.9rem}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px}
li{display:flex;justify-content:space-between;gap:1rem;padding:.75rem 1rem;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.p{font-weight:800;color:var(--gold);white-space:nowrap}
footer{padding:2rem 1rem 3rem;text-align:center;border-top:1px solid var(--line)}
footer a{display:inline-block;margin-bottom:.4rem;color:var(--ink);font-weight:800;font-size:1.6rem;text-decoration:none}
footer a:focus-visible{outline:3px solid var(--gold)}
footer p{margin:0;color:var(--muted)}
footer .owner{margin-top:.8rem;font-family:'Bowlby One',Impact,sans-serif;font-size:1.05rem;letter-spacing:.04em;color:var(--gold)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="drum" viewBox="-30 -70 60 140"><path d="M-3 22 L-3 54 A7 7 0 1 0 0 64 A7 7 0 1 0 3 54 L3 22Z" fill="#fff3e0" stroke="#3a1608" stroke-width="3" stroke-linejoin="round"/><path d="M0 -66 C24 -66 30 -42 24 -22 C19 -6 8 4 0 22 C-8 4 -19 -6 -24 -22 C-30 -42 -24 -66 0 -66Z" fill="#d8841f" stroke="#3a1608" stroke-width="3"/><path d="M-12 -50 C-8 -58 4 -60 10 -56" fill="none" stroke="#ffd27a" stroke-width="4" stroke-linecap="round"/></symbol>
<symbol id="horn" viewBox="0 0 60 60"><path d="M58 40 C36 42 14 32 3 4 C20 24 38 28 58 26Z" fill="#fff3e0" stroke="#3a1608" stroke-width="3" stroke-linejoin="round"/></symbol>
<symbol id="skull" viewBox="0 0 200 200">
<g transform="translate(100 112) rotate(135) translate(-100 -112)"><use href="#drum" x="64" y="28" width="72" height="168"/></g>
<g transform="translate(100 112) rotate(-135) translate(-100 -112)"><use href="#drum" x="64" y="28" width="72" height="168"/></g>
<use href="#horn" x="12" y="50" width="60" height="60"/>
<g transform="translate(200 0) scale(-1 1)"><use href="#horn" x="12" y="50" width="60" height="60"/></g>
<path d="M100 56 C76 56 64 74 66 98 C67 114 75 122 79 134 C81 146 88 158 100 158 C112 158 119 146 121 134 C125 122 133 114 134 98 C136 74 124 56 100 56Z" fill="#fff3e0" stroke="#3a1608" stroke-width="4" stroke-linejoin="round"/>
<path d="M100 58 L96 74 L102 84" fill="none" stroke="#3a1608" stroke-width="2.5" stroke-linecap="round"/>
<path d="M76 96 C76 88 88 88 94 98 C95 108 86 114 79 110 C76 106 76 100 76 96Z" fill="#1b110b"/>
<path d="M124 96 C124 88 112 88 106 98 C105 108 114 114 121 110 C124 106 124 100 124 96Z" fill="#1b110b"/>
<circle class="eye" cx="86" cy="101" r="3.5" fill="#ff3b1f"/><circle class="eye" cx="114" cy="101" r="3.5" fill="#ff3b1f"/>
<path d="M96 136 L100 126 L104 136 C103 142 97 142 96 136Z" fill="#1b110b"/>
<path d="M86 148 L86 156 M93 150 L93 158 M100 151 L100 159 M107 150 L107 158 M114 148 L114 156" stroke="#3a1608" stroke-width="2.5" stroke-linecap="round"/>
</symbol></defs></svg>
<header>
  <svg class="emblem" viewBox="0 0 200 200" role="img" aria-label="Bull skull over two crossed chicken drumsticks"><use href="#skull"/></svg>
  <p class="tag" lang="ta">நீங்கலாம் எனக்கு ஒரு பூளே இல்ல</p>
  <div class="badge">
    <h1 class="mark">CHICKOOZ</h1>
    <div class="ribbon">FRIED CHICKEN</div>
  </div>
  <p>Fried Chicken · Special Tasty Chicken</p>
</header>
<nav id="nav" aria-label="Menu categories"></nav>
<main id="menu"></main>
<footer>
  <svg class="emblem" viewBox="0 0 200 200" aria-hidden="true"><use href="#skull"/></svg>
  <a href="tel:+919952999039">9952999039</a>
  <p>Near Thirumullaivoyal Arch</p>
  <p class="owner">Owner: Prakash Chikkom</p>
</footer>
<script>
/* ===== EDIT YOUR MENU HERE: change names/prices, add or remove lines, then commit. ===== */
const MENU = [
  { name: "Fried chicken", items: [
    ["Chicken popcorn 180 gm", 150], ["Chicken wings 5 pcs", 150], ["Crispy strips 5 pcs", 180],
    ["Fried chicken 2 pcs", 190], ["Fried chicken 4 pcs", 350], ["Fried chicken 8 pcs", 620],
    ["Choice of chicken 1 pc", 110] ]},
  { name: "Hot & spicy chicken", note: "Nashville style", items: [
    ["Nashville strips", 200], ["Nashville wings", 180], ["Nashville pops", 160],
    ["Nashville burger", 150], ["Nashville frankie", 130] ]},
  { name: "French fries", items: [
    ["Classic fries", 60], ["Peri peri fries", 70], ["Cajun fries", 70], ["Jamaican fries", 70],
    ["Plain cheese loaded fries", 80], ["Cheese loaded fries", 99] ]},
  { name: "Chicken loaded fries", items: [
    ["Sweet & spicy loaded fries", 160], ["BBQ loaded fries", 160],
    ["Tandoori loaded fries", 160], ["Chickooz spl", 180] ]},
  { name: "Burger", items: [
    ["Sweet & spicy", 120], ["BBQ", 120], ["Tandoori", 120], ["Chickooz spl", 140], ["No bun burger", 240] ]},
  { name: "Wrap", items: [
    ["Tandoori", 120], ["BBQ", 120], ["Sweet & spicy", 120], ["Chickooz spl", 140] ]},
  { name: "Mojito", items: [
    ["Sea water breeze", 49], ["Lemon & mint breeze", 49], ["Green apple", 49], ["Strawberry", 49], ["Kiwi", 49] ]},
  { name: "Belgium waffle", items: [
    ["Dark waffle", 99], ["White waffle", 99], ["Milk waffle", 99], ["Triple waffle", 120] ]}
];
/* ===== end of editable menu ===== */

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("nav").innerHTML =
  MENU.map(c => `<a href="#${slug(c.name)}">${esc(c.name)}</a>`).join("");
document.getElementById("menu").innerHTML = MENU.map(c => `
  <section id="${slug(c.name)}">
    <h2>${esc(c.name)}</h2>
    ${c.note ? `<p class="note">${esc(c.note)}</p>` : ""}
    <ul>${c.items.map(([n, p]) => `<li><span>${esc(n)}</span><span class="p">₹${p}</span></li>`).join("")}</ul>
  </section>`).join("");
</script>
</body>
</html>
