<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Chickooz Fried Chicken – Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--white:#fff;--grey:#f1f1f1;--line:#2c2c2c}
*{box-sizing:border-box}
body{margin:0;color:var(--black);font-family:Nunito,system-ui,sans-serif;line-height:1.4;background:var(--white)}
header h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero{position:relative;max-width:960px;margin:0 auto;background:var(--black)}
.banner{display:block;width:100%;height:auto}
.hot{position:absolute;left:67%;top:40%;width:33%;height:28%;border-radius:14px}
.hot:focus-visible{outline:3px solid var(--white);outline-offset:-3px}
.call{display:block;padding:.8rem 1rem;background:var(--black);color:var(--white);text-align:center;text-decoration:none;font-weight:800;letter-spacing:.05em;border-top:2px solid var(--white)}
.call b{font-size:1.2em;letter-spacing:.06em}
.call:active{background:#222}
.call:focus-visible{outline:3px solid var(--white);outline-offset:-6px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:.5rem;overflow-x:auto;padding:.65rem .8rem;background:var(--black);scrollbar-width:none;border-top:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:.4rem .95rem;border-radius:99px;border:2px solid var(--white);color:var(--white);text-decoration:none;font-weight:800;font-size:.9rem}
nav a:hover,nav a:focus-visible{background:var(--white);color:var(--black);outline:none}
main{max-width:720px;margin:0 auto;padding:.6rem 1rem 1rem}
section{margin:1.8rem 0;scroll-margin-top:3.6rem}
.card{background:var(--black);color:var(--white);border-radius:18px;overflow:hidden;box-shadow:0 6px 0 #bdbdbd}
.head{position:relative;min-height:84px;display:flex;align-items:flex-end}
.head.has-img{min-height:132px}
.head img{position:absolute;right:0;top:0;width:min(52%,210px);height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(to right,transparent,#000 30%);mask-image:linear-gradient(to right,transparent,#000 30%)}
.ht{position:relative;z-index:1;max-width:58%;padding:1rem 1rem .9rem}
h2{margin:0;font-family:'Bowlby One',Impact,sans-serif;font-weight:400;font-size:1.45rem;line-height:1.08;letter-spacing:.01em;color:var(--white);text-shadow:0 2px 6px rgba(0,0,0,.8)}
.note{margin:.25rem 0 0;font-weight:800;font-size:.85rem;color:#d4d4d4}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 1rem;border-top:1px solid var(--line);font-weight:600}
.p{flex:none;padding:.1rem .7rem;border-radius:99px;background:var(--white);color:var(--black);font-weight:800}
footer{padding:2rem 1rem 3rem;text-align:center;background:var(--black);color:var(--white)}
footer a{display:inline-block;margin-bottom:.4rem;color:var(--white);font-weight:800;font-size:1.7rem;text-decoration:none;border-bottom:2px solid var(--white)}
footer a:focus-visible{outline:3px solid var(--white);outline-offset:4px}
footer p{margin:0;opacity:.85}
footer .owner{margin-top:.7rem;font-weight:800;opacity:1}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,20px);max-width:90vw;padding:.7rem 1.2rem;border-radius:12px;background:var(--white);color:var(--black);font-weight:800;border:2px solid var(--black);box-shadow:0 4px 0 var(--black);opacity:0;pointer-events:none;transition:.25s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

/* IMAGES: category name -> picture. To change a photo, replace its data with a file path like "images/burger.jpg". */

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("nav").innerHTML =
  MENU.map(c => `<a href="#${slug(c.name)}">${esc(c.name)}</a>`).join("");
document.getElementById("menu").innerHTML = MENU.map(c => {
  const img = IMAGES[c.name];
  return `
  <section id="${slug(c.name)}">
    <div class="card">
      <div class="head${img ? " has-img" : ""}">
        <div class="ht"><h2>${esc(c.name)}</h2>${c.note ? `<p class="note">${esc(c.note)}</p>` : ""}</div>
        ${img ? `<img src="${img}" alt="" width="360" height="395" loading="lazy">` : ""}
      </div>
      <ul>${c.items.map(([n, p]) => `<li><span>${esc(n)}</span><span class="p">₹${p}</span></li>`).join("")}</ul>
    </div>
  </section>`;
}).join("");

  var NUM="9952999039";
  var isPhone=/Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var toast=document.createElement("div");toast.id="toast";toast.setAttribute("role","status");document.body.appendChild(toast);
  var timer;function say(t){toast.textContent=t;toast.classList.add("show");clearTimeout(timer);timer=setTimeout(function(){toast.classList.remove("show")},3500)}
  function copy(){
    if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(NUM)}
    return new Promise(function(ok,no){var t=document.createElement("textarea");t.value=NUM;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy")?ok():no()}catch(e){no()}t.remove()})
  }
  if(isPhone)return;
  document.querySelectorAll('a[href^="tel:"]').forEach(function(a){
    a.addEventListener("click",function(e){
      e.preventDefault();
      copy().then(function(){say("Number copied: "+NUM+" – call from your phone")},function(){say("Call us on "+NUM)});
    });
  });
})();
</script>
</body>
</html>
